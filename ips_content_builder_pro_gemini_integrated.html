<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPS Builder Pro | Catatan Guru IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
        }

        .prose-editor {
            line-height: 1.8;
            outline: none;
            padding: 3rem;
            background: white;
            min-height: 85vh;
            font-size: 1.05rem;
        }

        .prose-editor h2 { font-family: 'Lora', serif; font-size: 2rem; font-weight: 700; color: #1e293b; margin: 2rem 0 1rem; border-bottom: 3px solid #e2e8f0; padding-bottom: 0.5rem; }
        .prose-editor h3 { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 600; color: #4338ca; margin: 1.5rem 0 0.75rem; }
        .prose-editor p { margin-bottom: 1.5rem; text-align: justify; }
        
        .asset-container { 
            margin: 2.5rem 0; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .asset-caption { 
            padding: 1rem; 
            font-size: 0.8rem; 
            color: #475569; 
            background: #f1f5f9; 
            border-top: 1px solid #e2e8f0;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .hots-card { background: #fdfdfd; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 12px; margin: 1.5rem 0; }
        .analysis-box { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 1rem; margin-top: 1rem; font-size: 0.9rem; }

        /* Floating AI Toolbar */
        .ai-toolbar {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 50;
        }
        .ai-btn {
            background: #1e293b;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .ai-btn:hover { background: #4338ca; transform: scale(1.05); }

        @media (max-width: 768px) {
            .prose-editor { padding: 1.5rem; font-size: 16px; }
            .ai-toolbar { bottom: 5rem; right: 1rem; }
        }
    </style>
</head>
<body class="pb-20 md:pb-0">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-indigo-200 shadow-xl">
                    <i class="fas fa-university text-xl"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-900 leading-tight">Catatan Guru IPS Builder</h1>
                    <p class="text-[10px] text-indigo-500 uppercase tracking-[0.2em] font-black">AI Integrated v3.6</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="copyHTML()" class="hidden md:flex text-xs font-bold px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition items-center gap-2">
                    <i class="fas fa-code"></i> COPY HTML
                </button>
                <button onclick="generateFullContent()" class="text-xs font-bold px-5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition items-center gap-2">
                    <i class="fas fa-wand-magic-sparkles"></i> <span class="hidden sm:inline">GENERATE LENGKAP</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:py-8 flex flex-col md:flex-row gap-8">
        <aside class="w-full md:w-80 space-y-4 order-2 md:order-1">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Kategori Konten</label>
                <select id="contentType" class="w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 transition-all text-sm outline-none mb-4 appearance-none font-medium">
                    <option value="Kajian Akademik">🏛️ Kajian Akademik</option>
                    <option value="Artikel Nalar Kritis Ilmiah">🧠 Artikel Nalar Kritis</option>
                    <option value="Refleksi Pembelajaran">📝 Refleksi Pembelajaran</option>
                    <option value="Latihan Soal HOTS">🎯 Latihan Soal HOTS</option>
                    <option value="LKPD">📋 LKPD (Lembar Kerja)</option>
                    <option value="Materi Pelajaran">📚 Materi Pelajaran</option>
                </select>

                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Topik Utama</label>
                <input id="topicInput" type="text" placeholder="Misal: Dinamika Sosial Masyarakat" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 transition-all text-sm outline-none mb-6 font-medium">
                
                <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100 mb-6">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-600">Sertakan Ilustrasi</label>
                        <input type="checkbox" id="includeImage" checked class="w-4 h-4 accent-indigo-600">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-600">Cari Video YouTube</label>
                        <input type="checkbox" id="includeVideo" checked class="w-4 h-4 accent-indigo-600">
                    </div>
                </div>

                <button onclick="generateFullContent()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> Buat Konten Sekarang
                </button>
            </div>

            <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl">
                <h4 class="text-xs font-bold text-indigo-700 uppercase mb-2">✨ Fitur Baru Gemini</h4>
                <p class="text-[11px] text-indigo-900 leading-relaxed opacity-80">Setelah konten jadi, gunakan tombol melayang di kanan bawah untuk optimasi SEO dan Glosarium.</p>
            </div>
        </aside>

        <div class="flex-1 order-1 md:order-2">
            <div id="editor-container" class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden min-h-[90vh]">
                <div id="editor" class="prose-editor" contenteditable="true">
                    <div class="text-center py-20">
                        <i class="fas fa-feather-alt text-4xl text-slate-200 mb-4"></i>
                        <h2 style="border:none">Area Kerja Bapak</h2>
                        <p class="text-center text-slate-400 italic">Konten akademik berkualitas akan tampil di sini.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- AI Floating Toolbar -->
    <div id="ai-tools" class="ai-toolbar hidden">
        <button onclick="generateSEO()" class="ai-btn">
            <i class="fas fa-search"></i> ✨ Buat SEO & Ringkasan
        </button>
        <button onclick="generateGlossary()" class="ai-btn">
            <i class="fas fa-book-open"></i> ✨ Generator Glosarium
        </button>
        <button onclick="generateRelatedTopics()" class="ai-btn">
            <i class="fas fa-lightbulb"></i> ✨ Ide Konten Terkait
        </button>
    </div>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center border border-white/20">
            <div class="w-20 h-20 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-8"></div>
            <h3 id="loader-title" class="font-bold text-xl text-slate-900 mb-3">Memproses...</h3>
            <p id="loader-desc" class="text-sm text-slate-500 leading-relaxed">Mohon tunggu sebentar, Pak Guru.</p>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const editor = document.getElementById('editor');
        const loader = document.getElementById('loader');
        const loaderTitle = document.getElementById('loader-title');
        const aiTools = document.getElementById('ai-tools');

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (response.ok) return await response.json();
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw new Error(`Error: ${response.status}`);
            } catch (error) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw error;
            }
        }

        async function generateFullContent() {
            const topic = document.getElementById('topicInput').value;
            const category = document.getElementById('contentType').value;
            if (!topic) return alert("Sebutkan topik risetnya, Pak.");

            loader.classList.remove('hidden'); loader.classList.add('flex');
            
            try {
                // 1. Generate Narrative
                loaderTitle.innerText = "Menyusun Narasi...";
                const systemPrompt = `Anda adalah Guru IPS Profesional, Peneliti, dan Tentor TKA Soshum. Gaya bahasa: Organik, tajam, intelektual, dan kredibel. 
                Buat konten '${category}' tentang '${topic}'. Sertakan rujukan literatur valid. Format HTML (h2, h3, p, blockquote).`;
                
                const textData = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Buat konten ${category} tentang ${topic}` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                
                let articleHtml = textData.candidates?.[0]?.content?.parts?.[0]?.text || "<p>Gagal memproses materi.</p>";
                articleHtml = articleHtml.replace(/```html/g, "").replace(/```/g, "");

                // 2. Image Generation
                let imageHtml = "";
                if (document.getElementById('includeImage').checked) {
                    loaderTitle.innerText = "Merancang Visual...";
                    try {
                        const imgData = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                instances: { prompt: `Sebuah ilustrasi edukasi profesional bergaya buku teks IPS tingkat lanjut tentang: ${topic}. Digital art, clean, informatif.` },
                                parameters: { sampleCount: 1 }
                            })
                        });
                        if (imgData.predictions?.[0]) {
                            const b64 = imgData.predictions[0].bytesBase64Encoded;
                            imageHtml = `
                                <div class="asset-container">
                                    <img src="data:image/png;base64,${b64}" alt="${topic}" class="w-full h-auto">
                                    <div class="asset-caption"><i class="fas fa-info-circle"></i> Ilustrasi visual pendukung untuk materi Catatan Guru IPS</div>
                                </div>`;
                        }
                    } catch (e) { console.error(e); }
                }

                // 3. Video Search
                let videoHtml = "";
                if (document.getElementById('includeVideo').checked) {
                    loaderTitle.innerText = "Sinkronisasi Video...";
                    try {
                        const searchData = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `URL video YouTube edukasi tentang ${topic}` }] }],
                                tools: [{ google_search: {} }]
                            })
                        });
                        const link = searchData.candidates?.[0]?.groundingMetadata?.groundingAttributions?.find(a => a.web?.uri?.includes('youtube.com'))?.web?.uri;
                        if (link) {
                            const vid = link.split('v=')[1]?.split('&')[0];
                            videoHtml = `
                                <div class="asset-container">
                                    <div class="video-wrapper">
                                        <iframe src="https://www.youtube.com/embed/${vid}" frameborder="0" allowfullscreen></iframe>
                                    </div>
                                    <div class="asset-caption"><i class="fab fa-youtube text-red-600"></i> Sumber Video Referensi</div>
                                </div>`;
                        }
                    } catch (e) { console.error(e); }
                }

                editor.innerHTML = `
                    <p style="text-align:center; font-weight:bold; color:#6366f1; letter-spacing:3px; font-size:12px; margin-bottom:0.5rem">CATATAN GURU IPS | ${category.toUpperCase()}</p>
                    <h2 class="text-center">${topic.toUpperCase()}</h2>
                    ${imageHtml}
                    <div id="main-content">${articleHtml}</div>
                    ${videoHtml}
                    <div id="ai-extras"></div>
                `;
                
                aiTools.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                alert("Gangguan: " + err.message);
            } finally {
                loader.classList.add('hidden');
            }
        }

        // ✨ FEATURE: SEO & Summary Generator
        async function generateSEO() {
            const content = document.getElementById('main-content').innerText;
            loader.classList.remove('hidden'); loader.classList.add('flex');
            loaderTitle.innerText = "Optimasi SEO...";

            try {
                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Berdasarkan teks ini, buatkan 1) Judul SEO-friendly, 2) Meta Description (maks 150 karakter), dan 3) 5 Hashtag Blogger. Teks: ${content.substring(0, 3000)}` }] }]
                    })
                });

                const seoText = res.candidates?.[0]?.content?.parts?.[0]?.text;
                const extraDiv = document.getElementById('ai-extras');
                extraDiv.innerHTML += `
                    <div class="bg-indigo-900 text-white p-6 rounded-2xl my-8 font-sans">
                        <h4 class="text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                            <i class="fas fa-search"></i> Data Optimasi SEO Blogger
                        </h4>
                        <div class="text-sm leading-relaxed opacity-90">${seoText.replace(/\n/g, '<br>')}</div>
                        <p class="mt-4 text-[10px] italic opacity-60">*Salin data ini ke kolom Deskripsi Penelusuran di Blogger Bapak.</p>
                    </div>
                `;
                alert("SEO berhasil dibuat di akhir dokumen!");
            } catch (e) { alert("Gagal membuat SEO."); }
            finally { loader.classList.add('hidden'); }
        }

        // ✨ FEATURE: Glossary Generator
        async function generateGlossary() {
            const content = document.getElementById('main-content').innerText;
            loader.classList.remove('hidden'); loader.classList.add('flex');
            loaderTitle.innerText = "Membuat Glosarium...";

            try {
                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Identifikasi 5 istilah penting dari teks ini dan buatkan glosarium singkat. Format HTML: dl, dt, dd. Teks: ${content.substring(0, 3000)}` }] }]
                    })
                });

                const glossaryHtml = res.candidates?.[0]?.content?.parts?.[0]?.text.replace(/```html/g, "").replace(/```/g, "");
                const extraDiv = document.getElementById('ai-extras');
                extraDiv.innerHTML += `
                    <div class="bg-slate-50 border-2 border-indigo-100 p-6 rounded-2xl my-8">
                        <h3 class="flex items-center gap-2"><i class="fas fa-book text-indigo-500"></i> Glosarium Istilah</h3>
                        <div class="text-sm">${glossaryHtml}</div>
                    </div>
                `;
                alert("Glosarium istilah ditambahkan!");
            } catch (e) { alert("Gagal membuat glosarium."); }
            finally { loader.classList.add('hidden'); }
        }

        // ✨ FEATURE: Related Content Ideas
        async function generateRelatedTopics() {
            const topic = document.getElementById('topicInput').value;
            loader.classList.remove('hidden'); loader.classList.add('flex');
            loaderTitle.innerText = "Mencari Inspirasi...";

            try {
                const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Berikan 3 ide topik artikel IPS selanjutnya yang berkaitan erat dengan topik '${topic}' agar blog saya memiliki topik yang berkesinambungan.` }] }]
                    })
                });

                const ideas = res.candidates?.[0]?.content?.parts?.[0]?.text;
                const extraDiv = document.getElementById('ai-extras');
                extraDiv.innerHTML += `
                    <div class="border-l-4 border-indigo-600 pl-6 my-8 italic">
                        <p class="text-xs font-bold text-indigo-600 uppercase mb-2">Ide Konten Selanjutnya:</p>
                        <div class="text-sm text-slate-600">${ideas.replace(/\n/g, '<br>')}</div>
                    </div>
                `;
                alert("Ide konten terkait ditambahkan!");
            } catch (e) { alert("Gagal mencari ide."); }
            finally { loader.classList.add('hidden'); }
        }

        function copyHTML() {
            const range = document.createRange();
            range.selectNode(editor);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                alert("Konten akademik siap ditempel di Blogger!");
            } catch (e) { alert("Gagal menyalin."); }
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
